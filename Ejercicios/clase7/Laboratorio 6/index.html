<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Monitoreo Hídrico</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #2c3e50; color: white; min-height: 60px;
        }

        .dashboard-layout { display: flex; min-height: calc(100vh - 60px); }

        /* Sidebar con Flexbox para empujar la firma al fondo */
        .sidebar { 
            flex: 1; background: #34495e; color: white; padding: 20px;
            display: flex; flex-direction: column; justify-content: space-between; 
        }

        .main-content { flex: 3; padding: 20px; }
        
        /* Estilo de la marca de programador */
        .dev-signature {
            font-size: 0.8rem;
            color: #95a5a6;
            border-top: 1px solid #4a6278;
            padding-top: 10px;
            text-align: center;
        }
        .dev-signature span { display: block; color: #3498db; font-weight: bold; }

        .sensor-grid { display: flex; gap: 16px; }
        .sensor-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">💧 AcueductosIoT</div>
        <button>Cerrar Sesión</button>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav>
                <ul style="list-style: none; padding: 0;">
                    <li>📊 Resumen</li>
                    <li>💧 Tanques</li>
                    <li>⚡ Presiones</li>
                </ul>
            </nav>

            <div class="dev-signature">
                <span>AquaTech Systems</span>
                Diseñado por David
            </div>
        </aside>

        <main class="main-content">
            <h1>Panel de Control</h1>
            <section class="sensor-grid">
                <div class="sensor-card">
                    <h3>Nivel de Tanque</h3>
                    <p>73%</p>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
